services:
  book-dental-app-stage:
    image: ghcr.io/zunkireelabs/book-dental:stage
    container_name: book-dental-app-stage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      - "traefik.http.routers.book-dental-app-stage.rule=Host(`dev-book-dental.zunkireelabs.com`)"
      - "traefik.http.routers.book-dental-app-stage.entrypoints=websecure"
      - "traefik.http.routers.book-dental-app-stage.tls=true"
      - "traefik.http.routers.book-dental-app-stage.tls.certresolver=letsencrypt"
      - "traefik.http.routers.book-dental-app-stage-http.rule=Host(`dev-book-dental.zunkireelabs.com`)"
      - "traefik.http.routers.book-dental-app-stage-http.entrypoints=web"
      - "traefik.http.routers.book-dental-app-stage-http.middlewares=book-dental-app-stage-redirect"
      - "traefik.http.middlewares.book-dental-app-stage-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.book-dental-app-stage.loadbalancer.server.port=80"
    networks:
      - hosting

networks:
  hosting:
    external: true
